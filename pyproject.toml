[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqtable"
dynamic = ["version"]
description = "Offline requirements table and diff report generator."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Norman" }]
keywords = ["requirements", "traceability", "report", "csv", "xlsx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/patrick984/reqtable"
Source = "https://github.com/patrick984/reqtable"
Issues = "https://github.com/patrick984/reqtable/issues"

[project.scripts]
reqtable = "reqtable.cli:main"

[tool.hatch.version]
path = "reqtable/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["reqtable"]

[tool.hatch.build.targets.sdist]
include = ["/reqtable", "/README.md", "/LICENSE"]
